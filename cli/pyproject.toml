[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "termchat-ai"
version = "0.1.0"
description = "A no-login terminal client for the AITerminal cloud AI service"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AITerminal contributors" }]
keywords = ["ai", "terminal", "groq", "netlify", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.scripts]
aiterminal = "aiterminal.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/aiterminal"]

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "pyproject.toml", "src/aiterminal", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
